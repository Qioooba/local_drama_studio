[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-drama-studio-api"
version = "0.1.0"
description = "LOCAL_ONLY FastAPI backend for LocalDramaStudio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
local-drama-api = "local_drama.entrypoints.api:main"
local-drama-worker = "local_drama.entrypoints.worker:main"
local-drama-maintenance = "local_drama.entrypoints.maintenance:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "comfyui: reads from or writes to the live loopback ComfyUI service; exclude while the operator owns ComfyUI",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["local_drama"]
