function contentPage(){let modes=[['script','text','已有口播稿'],['file','file','故事资料']];let input='';if(state.mode==='script')input='<div class="row between mb"><h3>口播稿</h3><div class="row"><button class="plain" data-action="choose-script">上传文稿</button><span class="tag green">'+ico('lock')+' 保护原文</span></div></div><label class="sr-only" for="script">口播稿正文</label><textarea class="script-box" id="script" data-field="script">'+esc(state.script)+'</textarea><div class="script-meta"><small id="charCount">'+state.script.replace(/\s/g,'').length+' 字 · 以最终配音时长为准</small><button class="plain" data-action="rewrite">'+ico('spark')+' AI 润色建议</button></div><div class="note green mt">默认直接使用你的讲稿。AI 润色先给建议，采用后才会替换原文。</div>';
if(state.mode==='file')input='<div class="row mb"><button class="tiny secondary" data-action="mode" data-value="file">上传资料</button><button class="tiny ghost" data-action="mode" data-value="pasteSources">粘贴正文</button><button class="tiny ghost" data-action="mode" data-value="links">参考链接</button></div><div class="upload">'+ico('upload')+'<strong>导入故事、小说或资料</strong><p>TXT / Markdown / DOCX / PDF / EPUB</p><button data-action="choose-source">选择文件</button><small>本原型可实际读取 TXT / MD；其他格式仅演示导入状态。</small></div>'+(state.sourceName?'<div class="source-card mt"><div><strong>'+esc(state.sourceName)+'</strong><p>'+ (state.sourceText?'已在浏览器本地读取，可检查提取文本':'已选择，正式产品需由解析器提取正文')+'</p></div><span class="tag green">已选择</span></div><details><summary>查看提取内容</summary><div><textarea id="sourceText" data-field="sourceText">'+esc(state.sourceText||'该格式在原型中不做正文解析。')+'</textarea></div></details>':'')+'<div class="note mt">导入后先提取正文，再识别人物与事件；扫描件无法提取时，给出清楚的处理提示。</div><button class="mt" data-action="make-script">'+ico('spark')+' 根据资料生成讲稿（模拟）</button>';
if(state.mode==='pasteSources')input='<div class="row mb"><button class="tiny ghost" data-action="mode" data-value="file">上传资料</button><button class="tiny secondary" data-action="mode" data-value="pasteSources">粘贴正文</button><button class="tiny ghost" data-action="mode" data-value="links">参考链接</button></div><div class="field"><label for="sourceText">故事或参考资料正文</label><textarea id="sourceText" data-field="sourceText" placeholder="把要改编的故事或资料放在这里">'+esc(state.sourceText)+'</textarea><p>资料会用于生成讲稿草案，原始资料保留。</p></div><button class="mt" data-action="make-script">'+ico('spark')+' 根据资料生成讲稿（模拟）</button>';
if(state.mode==='topic')input='<div class="field"><label for="topic">想讲什么故事？</label><textarea id="topic" data-field="topic" placeholder="描述主题、人物或你希望讲清楚的一件事">'+esc(state.topic)+'</textarea><p>越具体，生成的内容越贴近你的想法。</p></div><div class="twocol mt">'+selectField('topicGenre','内容类型',['原创故事','事实解说'],'原创故事')+selectField('topicTone','叙述方式',['悬念叙述','平实讲述','轻松讲述'],'悬念叙述')+'</div><button class="mt" data-action="make-script">'+ico('spark')+' 生成讲稿草案（模拟）</button><div class="note mt">示例使用虚构故事。事实解说在正式产品中先收集来源，资料不足时暂停补充。</div>';
if(state.mode==='links')input='<div class="row mb"><button class="tiny ghost" data-action="mode" data-value="file">上传资料</button><button class="tiny ghost" data-action="mode" data-value="pasteSources">粘贴正文</button><button class="tiny secondary" data-action="mode" data-value="links">参考链接</button></div><div class="field"><label for="urls">参考链接</label><textarea id="urls" data-field="urls" placeholder="每行一个链接">'+esc(state.urls)+'</textarea><p>正式产品会先读取链接内容，显示读取成功、失败与可用正文。</p></div><button class="mt" data-action="read-links">'+ico('link')+' 读取资料（模拟）</button><div class="note mt">离线原型不会访问链接。读取失败时应保留链接，并支持粘贴正文或上传文件。</div>';
return head(1,'让故事先讲清楚','先确定要讲什么，再制作人物、配音和画面。','<span class="tag">原创虚构示例</span>')+'<div class="content-layout"><div class="stack"><section class="panel"><div class="row between mb"><h3>你现在有什么？</h3><button class="plain" data-action="mode" data-value="topic">从主题开始 →</button></div><div class="modes">'+modes.map(m=>'<button class="mode '+((state.mode===m[0]||(m[0]==='file'&&['links','pasteSources'].includes(state.mode)))?'active':'')+'" data-action="mode" data-value="'+m[0]+'">'+ico(m[1])+'<span>'+m[2]+'</span></button>').join('')+'</div>'+input+'</section><section class="panel"><div class="twocol">'+(state.mode==='script'?'<div class="field"><label>讲稿时长</label><div class="note">按原稿自然配音 · 不为凑时长改稿</div></div>':selectField('duration','目标时长',['按讲稿自然时长','约 1 分钟','约 3 分钟','约 5 分钟'],state.duration))+selectField('aspect','画幅',['横屏 16:9','竖屏 9:16','方形 1:1'],'横屏 16:9')+'</div><div class="field mt"><label for="globalMotion">全片视频方式</label><select id="globalMotion"><option>静图推拉（默认）</option disabled>关键镜头 AI 动态 · 需可执行视频模型</option><option disabled>全部 AI 动态 · 需可执行视频模型与预算</option></select><p>正式产品确认模型能力可执行后，才开放 AI 动态策略。</p></div><details><summary>高级设置</summary><div class="twocol">'+selectField('planner','内容模型',['项目默认 · 本地模型','选择其他已配置模型'],'项目默认 · 本地模型')+'<div class="field"><label>稿件处理</label><label class="check"><input type="checkbox" checked disabled>已有稿件默认保持原文</label></div></div></details></section></div>'+infoAside()+'</div>'}
function currentAsset(){return assets[state.assetTab][state.assetIndex]||assets[state.assetTab][0]}
function assetKey(){const a=currentAsset();if(!a.id)a.id=state.assetTab+'-'+state.assetIndex;return a.id}
function candidateCard(i,kind,selected,preview,action,lock=false){return '<button class="candidate '+(preview===i?'previewing':'')+'" data-action="'+action+'" data-value="'+i+'" aria-label="预览候选 '+i+'" aria-pressed="'+(preview===i)+'">'+art(kind,i)+'<div class="candidate-meta"><span>候选 '+i+'</span>'+(selected===i?'<span class="tag green">'+(lock?'已锁定':'已采用')+'</span>':preview===i?'<span class="tag purple">预览中</span>':'')+'</div></button>'}
function assetPage(){const a=currentAsset(),key=assetKey(),count=state.assetCounts[key]||1,adopted=state.assetChoice[key]||1,preview=Math.min(state.assetPreview,count);return head(2,'先定人物，再定画面','AI 整理主体与场景；选好主参考，后续镜头沿用同一套设定。','<span class="tag green">2 位人物 · 2 处场景 · 1 件道具</span>')+'<div class="content-layout"><section class="panel"><div class="tabs" role="tablist" aria-label="参考资产类型">'+[['people','人物','2'],['scenes','场景','2'],['props','道具','1']].map(t=>'<button role="tab" aria-selected="'+(state.assetTab===t[0])+'" class="tab '+(state.assetTab===t[0]?'active':'')+'" data-action="asset-tab" data-value="'+t[0]+'">'+t[1]+' <small>'+t[2]+'</small></button>').join('')+'</div><div class="asset-layout"><div class="asset-list"><button class="tiny ghost" data-action="extract-entities">'+ico('spark')+' 识别人物与场景</button>'+assets[state.assetTab].map((a,i)=>'<button class="asset-item '+(state.assetIndex===i?'active':'')+'" data-action="asset" data-value="'+i+'"><span class="avatar">'+artwork(a.kind,1)+'</span><span><strong>'+a.name+'</strong><small>'+a.meta+'</small><small>出场 '+shots.filter(s=>s.refs.includes(a.name)).length+' 镜 · 已设参考</small></span></button>').join('')+'<button class="tiny ghost" data-action="add-asset">'+ico('plus')+' 添加'+({'people':'人物','scenes':'场景','props':'道具'}[state.assetTab])+'</button></div><div class="asset-body"><div class="panel-head"><div><h3>'+a.name+'</h3><p>'+a.meta+'</p></div><div class="row"><span class="tag green">已采用参考图</span><button class="plain" data-action="edit-asset">编辑描述</button></div></div><div class="asset-info"><div>'+art(a.kind,preview,'portrait')+'<div class="preview-status"><span class="selection-status">正在查看候选 '+preview+'</span>'+(adopted===preview?'<span class="tag green">主参考</span>':'<button class="tiny secondary" data-action="adopt-asset">采用</button>')+'<button class="tiny ghost" data-action="lock-asset">'+ico(state.assetLocked[key]?'lock':'unlock')+(state.assetLocked[key]?'解锁主参考':'锁定主参考')+'</button></div></div><div class="stack" style="align-content:start"><p class="asset-description">'+esc(a.desc)+'</p><div><span class="mini-heading">外观配色</span><div class="palette">'+a.colors.map(c=>'<span style="background:'+c+'"></span>').join('')+'</div></div><div class="note">这张主参考会用于相关镜头。更换主参考后，只提示受影响的画面。</div></div></div><div class="generation-bar"><div class="row"><strong style="font-size:13px">参考候选</strong><small>'+count+' 张</small></div><div class="row"><select class="compact-select" data-field="assetBatch" aria-label="本次生成参考图数量">'+[1,2,4].map(n=>'<option value="'+n+'"'+((state.assetBatchByKey[key]||(count===0&&state.assetTab==='people'?2:1))===n?' selected':'')+'>'+n+' 张</option>').join('')+'</select><button class="tiny" data-action="more-asset">'+ico('refresh')+' 再抽一组</button><button class="tiny ghost" data-action="upload-reference">'+ico('upload')+' 上传</button></div></div><div class="candidates">'+Array.from({length:count},(_,i)=>candidateCard(i+1,a.kind,adopted,preview,'asset-preview',Boolean(state.assetLocked[key]))).join('')+'</div><p class="micro-copy">点击候选只预览，设为主参考后才用于生成。所有旧候选都会保留。</p></div></div></section><aside class="stack"><section class="panel"><div class="panel-head"><h3>全片画风</h3><span class="tag purple">统一使用</span></div>'+selectField('style','视觉风格',['写实插画','摄影写实','电影动画','水彩插画','自定义'],state.style)+'<div class="palette"><span style="background:#193649"></span><span style="background:#5a7183"></span><span style="background:#d8b77a"></span><span style="background:#d4d5d2"></span></div><p class="muted" style="font-size:12px;margin-top:12px;line-height:1.8">冷蓝雨夜与暖色灯光；人物、场景和镜头使用同一组风格约束。</p><details><summary>高级设置</summary><div class="stack">'+selectField('referenceModel','参考图模型',['项目默认 · 图像模型','选择其他已配置模型'],'项目默认 · 图像模型')+'<div class="field"><label for="styleNotes">补充风格要求</label><textarea id="styleNotes" style="min-height:90px" placeholder="例如：低饱和、柔和光线">冷蓝与暖黄，避免过度锐化</textarea></div></div></details></section><p class="aside-caption">只为主要人物和反复出现的场景建立参考；一次性路人无需逐个定妆。</p></aside></div>'}
function wave(){return '<div class="wave '+(playing?'playing':'')+'" aria-hidden="true">'+Array.from({length:64},(_,i)=>'<i style="height:'+(6+(i*17)%33)+'px;--n:'+i+'"></i>').join('')+'</div>'}
function voicePage(){return head(3,'让故事拥有自己的声音','先听一小段，满意后生成全篇。修改一段，可以只重读这一段。','<span class="tag">普通话 · 示例声音设置</span>')+'<div class="voice-layout"><section class="panel stack"><div class="row"><div class="voice-avatar">'+ico('mic')+'</div><div><h3>旁白声音</h3><small>全片使用同一位讲述者</small></div></div>'+selectField('voice','音色',['温和男声','沉稳男声','清晰女声','温柔女声','选择已保存音色'],state.voice)+selectField('rate','语速',['稍慢','标准','稍快'],state.rate)+selectField('emotion','语气',['自然讲述','悬念叙述','温暖平静'],'悬念叙述')+'<button data-action="listen">'+ico('play')+' 试听 10 秒（模拟）</button><div class="note">原型无真实音频。正式产品使用可试听的已配置音色，并保存配音版本。</div><details><summary>高级设置</summary><div class="stack">'+selectField('tts','配音模型',['项目默认 · 配音模型','选择其他已配置模型'],'项目默认 · 配音模型')+'<label class="check"><input type="checkbox" checked>保留段落停顿</label></div></details></section><section class="panel"><div class="panel-head"><div><h3>旁白试听与分段</h3><p>当前展示 48 秒示例片段，音频播放为交互示意。</p></div><span class="tag '+(state.voiceReady?'green':'')+'">'+(state.voiceReady?'示例配音已就绪':'待生成配音')+'</span></div><div class="audio-bar"><button class="audio-play" data-action="listen" aria-label="播放示例交互">'+ico(playing?'pause':'play')+'</button>'+wave()+'<small>00:00 / 00:48</small></div>'+shots.slice(0,3).map((s,i)=>'<div class="segment"><div class="segment-time">'+s.time.replace('–','<br>')+'</div><div><p>'+s.quote+'</p><span class="tag '+(i===0?'green':'')+'">'+(i===0?'发音检查完成':'可单段重读')+'</span></div><button class="tiny ghost" data-action="reread" data-value="'+i+'">'+ico('refresh')+' 重读</button></div>').join('')+'<details><summary>读音与停顿修正</summary><div class="twocol"><div class="field"><label for="pronounce">需要修正的词</label><input id="pronounce" type="text" value="林舟"></div><div class="field"><label for="pronounceTo">期望读音</label><input id="pronounceTo" type="text" value="lín zhōu"></div></div><button class="tiny mt" data-action="pronunciation">保存修正</button></details></section></div>'}
function shotRail(video=false){return '<nav class="shot-list" aria-label="镜头列表"><div class="shot-list-header"><span>全部镜头</span><span>6 个示例</span></div>'+shots.map((s,i)=>'<button class="shot '+(state.shot===i?'active':'')+'" data-action="shot" data-value="'+i+'" aria-current="'+(state.shot===i?'true':'false')+'"><span class="shot-thumb">'+artwork(s.kind,state.chosen[i])+'</span><span><span class="shot-name">'+String(i+1).padStart(2,'0')+' '+s.name+'</span><small>'+s.time+' · '+(video?(state.videoKeepOld[i]?'保留旧片段':state.videoStale[i]?'待更新':state.videoLocked[i]?'已锁定':'已采用'):(state.locked[i]?'已锁定':'已采用'))+'</small></span></button>').join('')+'</nav>'}
function shotPage(){const i=state.shot,s=shots[i],count=state.counts[i],chosen=state.chosen[i],p=Math.min(state.preview,count);return head(4,'挑出你满意的画面','每个镜头都有对应的旁白、参考和候选；只改不满意的那一张。','<span class="tag green">6 / 6 个镜头已有画面</span>')+'<div class="shot-layout">'+shotRail()+'<section class="panel shot-editor"><div class="panel-head"><div class="row"><h3>镜头 '+String(i+1).padStart(2,'0')+' · '+s.name+'</h3><span class="tag">8 秒</span></div><button class="plain" data-action="edit-shot">编辑镜头</button></div><div class="shot-top"><div>'+art(s.kind,p)+'<div class="preview-status"><span class="selection-status">'+(chosen===p?'当前已采用':'正在预览')+' · 候选 '+p+'</span><div class="shot-controls">'+(chosen!==p?'<button class="tiny secondary" data-action="adopt-image">采用</button>':'')+'<button class="tiny ghost" data-action="lock-image" '+(chosen!==p?'disabled':'')+'>'+ico(state.locked[i]?'lock':'unlock')+(state.locked[i]?'已锁定':'锁定')+'</button></div></div></div><div><span class="field-label">对应旁白</span><p class="quote">“'+s.quote+'”</p><div class="mini-heading">画面内容</div><p class="prompt-text">'+s.prompt+'</p><div class="mini-heading">使用的参考</div><div class="chips">'+s.refs.map(r=>'<span class="tag">'+r+'</span>').join('')+'</div><details><summary>提示词与生成设置</summary><div class="field"><label for="shotPrompt">画面提示词</label><textarea id="shotPrompt" data-field="shotPrompt" style="min-height:110px">'+esc(s.prompt)+'</textarea>'+selectField('imageModel','图像模型',['项目默认 · 图像模型','选择其他已配置模型'],'项目默认 · 图像模型')+'</div></details></div></div><div class="line"></div><div class="generation-bar"><div class="row"><h3 style="font-size:14px">画面候选</h3><small>'+count+' 张 · 历史保留</small></div><div class="row"><button class="tiny ghost" data-action="compare-images">'+ico('compare')+' 并排比较</button><select class="compact-select" data-field="imageBatch" aria-label="本次图片候选数量">'+[1,2,4].map(n=>'<option value="'+n+'"'+(Number(state.imageBatch)===n?' selected':'')+'>本次 '+n+' 张</option>').join('')+'</select><button class="tiny" document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,v=b.dataset.value,i=state.shot;switch(action){case'step':goto(Number(v));break;case'previous':goto(Math.max(1,state.step-1));break;case'next':next();break;case'mode':state.mode=v;render();break;case'progress':showProgress();break;case'help':modal('原型使用说明','<div class="stack"><p>这是解说工厂的六步交互设计原型，全部在本地页面内运行。</p><p class="muted">可以切换输入方式、读取 TXT / MD、编辑讲稿、选择主参考、追加图片与视频候选、采用或锁定、模拟试听与一键流程，并下载制作清单。</p><div class="note">图片使用内联图形占位。人物提取、写稿、生图、配音、视频生成及成片导出均为模拟，没有调用网络或模型。</div><p class="muted">示例选择会尽力保留在当前浏览器。切换页面不丢失；浏览器禁用本地存储时仍在本次打开期间保留。</p></div>','<button class="ghost" data-action="reset">重置示例</button><button class="primary" data-action="close-dialog">开始体验</button>');break;case'keep-old-videos':{const ids=lockedStaleVideos();for(const j of ids)state.videoKeepOld[j]=true;closeModal();render();toast('已明确保留这些旧片段；锁定和旧输入记录保留，不应用这次上游修改。');break}case'unlock-rebuild-videos':{const ids=lockedStaleVideos();for(const j of ids){state.videoLocked[j]=false;state.videoKeepOld[j]=false}rebuildVideos(ids);closeModal();render();toast('已解锁并模拟重做受影响片段；旧视频保留为历史候选。');break}case'close-dialog':closeModal();break;case'reset':state=JSON.parse(JSON.stringify(defaults));stopPlayback();closeModal();render();toast('已恢复初始示例。');break;case'choose-script':document.getElementById('sourceFile').click();break;case'choose-source':document.getElementById('sourceFile').click();break;case'choose-video':document.getElementById('videoFile').click();break;case'upload-reference':pendingUpload='asset';document.getElementById('referenceFile').click();break;case'upload-image':pendingUpload='image';document.getElementById('referenceFile').click();break;case'make-script':if(state.mode==='file'&&!state.sourceName){toast('请先选择一份资料。');break}modal('讲稿草案（模拟）','<div class="note mb">正式产品会基于所选内容调用模型。本原型只展示“雨夜灯塔”的示例草案，不将它当作你上传资料的真实摘要。</div><textarea id="draftScript" style="min-height:290px">'+esc(originalScript)+'</textarea>','<button class="ghost" data-action="close-dialog">返回资料</button><button class="primary" data-action="use-draft">使用示例草案</button>');break;case'use-draft':state.script=document.getElementById('draftScript').value;state.mode='script';state.scriptLocked=false;state.complete[0]=false;closeModal();render();toast('示例草案已放入编辑区，请确认后继续。');break;case'read-links':if(!state.urls.trim()){toast('请先填写参考链接。');break}modal('读取资料的反馈设计','<div class="source-card"><div><strong>参考链接已接收</strong><p>'+esc(state.urls.split('\n')[0])+'</p></div><span class="tag">仅示意</span></div><p class="muted mt">此原型不会发起网络请求。正式产品应逐条返回读取结果，并让用户查看提取正文。</p><div class="note mt">读取失败：显示具体原因，并提供“重试”“粘贴正文”“上传文件”。</div>','<button class="ghost" data-action="links-to-file">改为上传资料</button><button class="primary" data-action="close-dialog">知道了</button>');break;case'links-to-file':closeModal();state.mode='file';render();break;case'rewrite':modal('AI 润色建议（模拟）','<p class="muted mb">建议先预览；只有采用后才替换稿件，原文仍可恢复。</p><div class="twocol"><div class="field"><label>原句</label><div class="note">暴雨把海岸线藏进了黑暗。</div></div><div class="field"><label>建议句</label><div class="note">那一夜，暴雨将整条海岸线藏进了黑暗。</div></div></div><div class="note mt">本次只演示改写开头，未调用 AI。</div>','<button class="ghost" data-action="close-dialog">保留原文</button><button class="primary" data-action="apply-rewrite">采用这条建议</button>');break;case'apply-rewrite':state.script=state.script.replace('暴雨把海岸线藏进了黑暗。','那一夜，暴雨将整条海岸线藏进了黑暗。');state.complete[0]=false;state.voiceReady=false;closeModal();render();toast('已采用建议。旁白需更新，人物与镜头选择已保留。');break;case'asset-tab':state.assetTab=v;state.assetIndex=0;state.assetPreview=1;render();break;case'asset':state.assetIndex=Number(v);state.assetPreview=state.assetChoice[assetKey()]||1;render();break;case'asset-preview':state.assetPreview=Number(v);render();break;case'lock-asset':state.assetLocked[assetKey()]=!state.assetLocked[assetKey()];render();toast(state.assetLocked[assetKey()]?'主参考已锁定，追加候选和一键流程都会保留当前选择。':'主参考已解锁，可以更换采用的参考图。');break;case'adopt-asset':if(state.assetLocked[assetKey()]&&state.assetChoice[assetKey()]!==state.assetPreview){toast('主参考已锁定，请先解锁后再更换；当前参考保持不变。');break}state.assetChoice[assetKey()]=state.assetPreview;state.complete[1]=false;render();toast('已设为主参考。正式产品只标记引用该参考的画面需要检查。');break;case'more-asset':{const s=document.querySelector('[data-field="assetBatch"]'),n=parseInt(s?s.value:2,10);state.assetCounts[assetKey()]=(state.assetCounts[assetKey()]||1)+n;state.assetPreview=state.assetCounts[assetKey()];render();toast('已追加 '+n+' 张示例参考候选；旧主参考保持不变。');break}case'extract-entities':modal('人物与场景识别建议（模拟）','<p class="muted mb">正式产品读取已保存稿件，结合出现位置识别主体，并合并已有资产。</p><ul class="summary-list"><li><span>人物</span><strong>林舟、陈姨</strong></li><li><span>场景</span><strong>灯塔外景、灯塔内景</strong></li><li><span>关键道具</span><strong>旧煤油灯</strong></li></ul><div class="note mt">本原型展示预设建议，不是对当前稿件运行模型的结果。可逐个编辑，已有主参考保留。</div>','<button class="ghost" data-action="close-dialog">返回</button><button class="primary" data-action="accept-entities">确认示例建议</button>');break;case'accept-entities':closeModal();toast('已确认示例人物与场景，沿用已有主参考。');break;case'edit-asset':modal('编辑'+currentAsset().name+'的描述','<div class="field"><label for="assetDesc">外观与一致性要求</label><textarea id="assetDesc">'+esc(currentAsset().desc)+'</textarea></div>','<button class="ghost" data-action="close-dialog">取消</button><button class="primary" data-action="save-asset">保存描述</button>');break;case'save-asset':currentAsset().desc=document.getElementById('assetDesc').value;closeModal();render();toast('描述已在本次页面内更新；下一次生成使用新描述。');break;case'add-asset':modal('补充'+({'people':'人物','scenes':'场景','props':'道具'}[state.assetTab]),'<div class="stack"><div class="field"><label for="newAssetName">名称</label><input type="text" id="newAssetName" placeholder="输入名称"></div><div class="field"><label for="newAssetDesc">需要保持一致的特征</label><textarea id="newAssetDesc" placeholder="外观、服装、年代或空间特征"></textarea></div></div>','<button class="ghost" data-action="close-dialog">取消</button><button class="primary" data-action="save-new-asset">添加示例资产</button>');break;case'save-new-asset':{let name=document.getElementById('newAssetName').value.trim();if(!name){toast('请填写名称。');break}assets[state.assetTab].push({name,meta:'手动补充',desc:document.getElementById('newAssetDesc').value,kind:state.assetTab==='people'?'person':state.assetTab==='props'?'lantern':'coast',colors:['#273e52','#d7b578','#6d8398']});state.assetIndex=assets[state.assetTab].length-1;state.assetCounts[assetKey()]=1;state.assetChoice[assetKey()]=1;state.assetPreview=1;closeModal();render();toast('已添加示例资产；新增描述在本次页面内保留。');break}case'listen':playback(false);break;case'reread':modal('只重读这一段','<p class="quote">'+shots[Number(v)].quote+'</p><p class="muted">沿用当前音色和语速，其他旁白保留。正式产品完成后更新受影响的对齐与合成。</p><div class="note mt">此操作为模拟，不产生音频。</div>','<button class="ghost" data-action="close-dialog">取消</button><button class="primary" data-action="confirm-reread">重读本段（模拟）</button>');break;case'confirm-reread':closeModal();state.voiceReady=true;render();toast('本段重读已模拟完成；其他段落保留。');break;case'pronunciation':toast('读音修正已在本次示例中确认。正式产品会在重读时传入配音模型。');break;case'shot':state.shot=Number(v);state.preview=state.chosen[state.shot];state.videoPreview=state.videoChosen[state.shot];render();break;case'image-preview':state.preview=Number(v);render();break;case'adopt-image':if(state.locked[i]){toast('当前画面已锁定，请先解锁后再更换。');break}state.chosen[i]=state.preview;state.videoStale[i]=true;state.videoKeepOld[i]=false;state.complete[3]=false;state.complete[4]=false;state.complete[5]=false;render();toast('已采用新画面。仅本镜头的视频需要更新；旧候选保留。');break;case'lock-image':state.locked[i]=!state.locked[i];render();toast(state.locked[i]?'已锁定当前画面，一键流程会保留它。':'已解除画面锁定，可以更换候选。');break;case'more-images':{let n=Number(state.imageBatch)||1;state.counts[i]+=n;state.preview=state.counts[i];render();toast('已追加 '+n+' 张示例候选，当前采用与锁定保持不变。');break}case'compare-images':compare(false);break;case'edit-shot':modal('编辑镜头 '+String(i+1).padStart(2,'0'),'<div class="stack"><div class="field"><label for="editQuote">对应旁白（仅查看）</label><textarea id="editQuote" readonly style="min-height:70px">'+esc(shots[i].quote)+'</textarea></div><div class="field"><label for="editShotPrompt">希望画面展示什么</label><textarea id="editShotPrompt">'+esc(shots[i].prompt)+'</textarea></div></div>','<button class="ghost" data-action="close-dialog">取消</button><button class="primary" data-action="save-shot">保存镜头要求</button>');break;case'save-shot':shots[i].prompt=document.getElementById('editShotPrompt').value;closeModal();render();toast('镜头要求已保存。再抽图片时使用新要求，旧图片保留。');break;case'to-image':goto(4);break;case'motion':state.motion[i]=v;state.videoStale[i]=true;state.videoKeepOld[i]=false;state.videoReady=false;render();toast('已更换本镜头的动态方式；当前图片保持不变。');break;case'play-clip':toast('片段播放控件演示：原型没有真实 MP4，正式产品在此播放采用的视频。');break;case'video-preview':state.videoPreview=Number(v);render();break;case'adopt-video':if(state.videoLocked[i]){toast('当前视频已锁定，请先解锁后再更换。');break}state.videoChosen[i]=state.videoPreview;state.videoStale[i]=false;state.videoKeepOld[i]=false;state.videoBaseImages[i]=state.chosen[i];state.complete[5]=false;render();toast('已采用视频候选，底图保持不变；更新成片时使用这个版本。');break;case'lock-video':state.videoLocked[i]=!state.videoLocked[i];render();toast(state.videoLocked[i]?'视频已锁定，一键流程保留当前选择。':'已解除视频锁定。');break;case'more-videos':{let n=Number(state.videoBatch)||1;state.videoCounts[i]+=n;state.videoPreview=state.videoCounts[i];render();toast('已追加 '+n+' 个视频候选示意，底图与当前采用保持不变。');break}case'compare-videos':compare(true);break;case'play-final':playback(true);break;case'seek':stopPlayback();state.previewShot=Number(v);render();break;case'fix-current':state.shot=state.previewShot;goto(4);break;case'autorun':autorun();break;case'start-run':startRun();break;case'stoprun':clearInterval(runTimer);runTimer=null;document.getElementById('runbar').classList.remove('show');render();if(document.getElementById('dialog').open&&document.getElementById('dialogTitle').textContent==='制作进度')showProgress();toast('已停止流程演示，保留已有选择。');break;case'download-plan':downloadPlan();break;}save()});
document.addEventListener('input',e=>{const f=e.target.dataset.field;if(!f)return;if(['script','topic','urls','sourceText'].includes(f)){state[f]=e.target.value;if(f==='script'){state.complete[0]=false;state.voiceReady=false;const c=document.getElementById('charCount');if(c)c.textContent=state.script.replace(/\s/g,'').length+' 字 · 以最终配音时长为准'}save()}});
document.addEventListener('change',e=>{const f=e.target.dataset.field;if(!f)return;if(f==='assetBatch'){state.assetBatchByKey[assetKey()]=Number(e.target.value);save()}else if(['style','voice','rate','imageBatch','videoBatch','quality','duration'].includes(f)){state[f]=e.target.value;if(f==='voice'||f==='rate'){state.voiceReady=false;state.complete[2]=false}save();if(['style','voice','rate'].includes(f))toast('设置已保存；重新生成时使用新设置。');if(['voice','rate'].includes(f))render()}else if(f==='subtitles'||f==='music'){state[f]=e.target.checked;render()}else if(f==='shotPrompt'){shots[state.shot].prompt=e.target.value;toast('提示词已在本次页面内更新；旧画面保留。')}else if(f==='aspect'){if(e.target.value!=='横屏 16:9'){toast('此原型重点展示横屏流程；正式产品切换画幅时更新构图与输出。');e.target.value='横屏 16:9'}}else if(['planner','referenceModel','imageModel','videoModel','tts'].includes(f)&&e.target.selectedIndex>0){modal('选择已配置模型','<p class="muted">正式产品只列出已配置且支持当前任务的模型，并显示可用状态、能力与必要的参数。</p><div class="note mt">本原型没有模型服务。当前继续使用“项目默认”。</div>');e.target.selectedIndex=0}});
document.getElementById('sourceFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;state.sourceName=f.name;if(/\.(txt|md)$/i.test(f.name)){if(f.size>2*1024*1024){state.sourceText='';toast('演示读取限制为 2 MB。正式产品应分块解析较大的文本。')}else{state.sourceText=await f.text();if(state.mode==='script'){state.script=state.sourceText;state.complete[0]=false;state.voiceReady=false;toast('已把文稿原文读入编辑区，没有改写或上传。')}else toast('已在本地读取文本，可展开查看；没有上传文件。')}}else{state.sourceText='';toast('文件已选择。此原型不解析该格式，正式产品应交给对应解析器。')}render();e.target.value=''});
document.getElementById('referenceFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(pendingUpload==='asset'){state.assetCounts[assetKey()]=(state.assetCounts[assetKey()]||1)+1;state.assetPreview=state.assetCounts[assetKey()]}else{state.counts[state.shot]++;state.preview=state.counts[state.shot]}render();toast('已添加上传候选的交互示意：'+f.name+'。原型仍使用占位图，不保存图片。');e.target.value=''});
document.getElementById('videoFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;state.motion[state.shot]='upload';state.videoCounts[state.shot]++;state.videoPreview=state.videoCounts[state.shot];render();toast('已添加视频素材示意：'+f.name+'。原型不保存或转码视频。');e.target.value=''});
document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
const initialStep=new URLSearchParams(location.search).get('step');if(initialStep&&Number(initialStep)>=1&&Number(initialStep)<=6)state.step=Number(initialStep);
render();
